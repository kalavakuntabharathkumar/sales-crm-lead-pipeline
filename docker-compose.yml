services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
      POSTGRES_DB: crm
    ports: ["5432:5432"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  api:
    build: ./server
    environment:
      DATABASE_URL: postgresql://crm:crm@db:5432/crm
      REDIS_URL: redis://redis:6379
      PORT: 4000
    ports: ["4000:4000"]
    depends_on: [db, redis]
  web:
    build: ./client
    ports: ["5173:5173"]
    depends_on: [api]
